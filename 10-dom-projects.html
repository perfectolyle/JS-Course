<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Projects</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        .subscribe-button {
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            color: white;
            background-color: rgb(0, 0, 0);
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 40px;
            transition: background-color 0.15s;
        }

        .subscribe-button:hover {
            background-color: rgb(78, 78, 78);
        }

        .subscribed-button {
            background-color: rgb(240, 240, 240);
            color: black;
        }

        .subscribed-button:hover {
            background-color: rgb(210, 210, 210);
        }

        .cost-input {
            font-size: 15px;
            margin-bottom: 10px;
            padding: 10px;
        }

        .calculate-button {
            padding: 12px 15px;
            background-color: green;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <p>YouTube subscriber Button</p>
    <button class="js-subscribe-button subscribe-button" onclick="  
        subscribe();
    ">
        Subscribe
    </button>


    <p>Amazon Shipping Calculator</p>
    <input type="number" placeholder="Cost of Order" class="js-cost-input cost-input" onkeydown="handleCostKeydown(event)">
    <button onclick=" 
        calculateTotal(); 
    " class="calculate-button">
        Calculate
    </button>
    <p class="js-total-cost"></p>

    <script>
        function handleCostKeydown(event) {
            if (event.key === 'Enter') {
                calculateTotal();
            }
        }

        function calculateTotal(){
            const inputElement = document.querySelector('.js-cost-input');
            let cost = Number(inputElement.value);

            if(cost <= 40) {
                cost += 10;
            }

            document.querySelector('.js-total-cost').innerHTML = `Total: $${cost}`;
        }


        function subscribe(){
            const subscribeButton = document.querySelector('.js-subscribe-button');
            if (subscribeButton.innerText === 'Subscribe') {
                subscribeButton.innerText = 'Subscribed';
                subscribeButton.classList.add('subscribed-button');
            } else {
                subscribeButton.innerText = 'Subscribe';
                subscribeButton.classList.remove('subscribed-button');
            } 
        }
    </script>
</body>
</html>
