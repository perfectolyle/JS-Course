<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <h1>Rock Paper Scissors</h1>
    <button onclick="
        playGame('Rock');
    ">Rock</button>
    <button onclick="
        playGame('Paper');
    ">Paper</button>
    <button onclick="
        playGame('Scissors');
    ">Scissors</button>

    <script>
        console.log('Hello');
        function pickComputerMove() {
            const randomNunber = Math.random();
            let computerMove = '';
            if (randomNunber < 1/3) {
                computerMove = 'Rock';
            } else if (randomNunber >= 1/3 && randomNunber < 2/3){
                computerMove = 'Paper';
            } else if (randomNunber >= 2/3 && randomNunber < 1) {
                computerMove = 'Scissors';
            }

            return computerMove;
        }

        function playGame(yourMove) {
            const computerMove = pickComputerMove();

            let result = '';
            if (yourMove === 'Scissors') {
                if (computerMove === yourMove) {
                    result = 'Tie!';
                } else if (computerMove === 'Rock') {
                    result = 'You Lose!';
                } else if (computerMove === 'Paper') {
                    result = 'You Win!';
                }
            } else if (yourMove === 'Rock'){
                if (computerMove === yourMove){
                    result = 'Tie!';
                } else if (computerMove === 'Scissors'){
                    result = 'You Win!';
                } else if (computerMove === 'Paper'){
                    result = 'You Lose!';
                }
            } else if (yourMove === 'Paper'){
                if (computerMove === yourMove){
                    result = 'Tie!';
                } else if (computerMove === 'Scissors'){
                    result = 'You Lose!';
                } else if (computerMove === 'Rock'){
                    result = 'You Win!';
                }
            }
            
            alert(`You picked ${yourMove}. Computer picked ${computerMove}. ${result}`);
        }
    </script>
</body>
</html>
