<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <h1>Rock Paper Scissors</h1>
    <button onclick="
        const game = playGame('Rock');
        updateScore();
    ">Rock</button>
    <button onclick="
        game = playGame('Paper');
        updateScore();
    ">Paper</button>
    <button onclick="
        game = playGame('Scissors');
        updateScore();
    ">Scissors</button>
    <button onclick="
        score.wins = 0;
        score.losses = 0;
        score.ties = 0;
        console.log(score);
        updateScore();
    ">Reset Score</button>

    <p class="js-score"></p>
    <p class="js-moves"></p>
    <p class="js-result"></p>


    <script>
        const score = JSON.parse(localStorage.getItem('score'));
        if (!score) {
            score = {
                wins: 0,
                losses: 0,
                ties: 0
            };
        }

        function updateScore(){
            document.querySelector('.js-score').innerHTML = `Score: Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;
        }

        updateScore();        
        
        function pickComputerMove() {
            const randomNunber = Math.random();
            let computerMove = '';
            if (randomNunber < 1/3) {
                computerMove = 'Rock';
            } else if (randomNunber >= 1/3 && randomNunber < 2/3){
                computerMove = 'Paper';
            } else if (randomNunber >= 2/3 && randomNunber < 1) {
                computerMove = 'Scissors';
            }

            return computerMove;
        }

        function playGame(yourMove) {
            const computerMove = pickComputerMove();

            let result = '';
            if (yourMove === 'Scissors') {
                if (computerMove === yourMove) {
                    result = 'Tie!';
                } else if (computerMove === 'Rock') {
                    result = 'You Lose!';
                } else if (computerMove === 'Paper') {
                    result = 'You Win!';
                }
            } else if (yourMove === 'Rock'){
                if (computerMove === yourMove){
                    result = 'Tie!';
                } else if (computerMove === 'Scissors'){
                    result = 'You Win!';
                } else if (computerMove === 'Paper'){
                    result = 'You Lose!';
                }
            } else if (yourMove === 'Paper'){
                if (computerMove === yourMove){
                    result = 'Tie!';
                } else if (computerMove === 'Scissors'){
                    result = 'You Lose!';
                } else if (computerMove === 'Rock'){
                    result = 'You Win!';
                }
            }

            if (result === 'You Win!'){
                score.wins += 1;
            } else if (result === 'You Lose!'){
                score.losses += 1;
            } else if (result === 'Tie!'){
                score.ties += 1;
            }

            localStorage.setItem('score', JSON.stringify(score));


            document.querySelector('.js-moves').innerHTML = `You picked - ${yourMove.toUpperCase()} VS Computer picked - ${computerMove}.`;
            document.querySelector('.js-result').innerHTML = result;


            return {
                yourMove,
                computerMove,
                result
            };
        }

    </script>
</body>
</html>
