<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <h1>Rock Paper Scissors</h1>
    <button onclick="
        const game = playGame('Rock');
        toast(game.yourMove, game.computerMove, game.result);
    ">Rock</button>
    <button onclick="
        game = playGame('Paper');
        toast(game.yourMove, game.computerMove, game.result);
    ">Paper</button>
    <button onclick="
        game = playGame('Scissors');
        toast(game.yourMove, game.computerMove, game.result);
    ">Scissors</button>
    <button onclick="
        score.wins = 0;
        score.losses = 0;
        score.ties = 0;
        console.log(score);
        toast();
    ">Reset Score</button>

    <script>
        const score = JSON.parse(localStorage.getItem('score'));
        if (!score) {
            score = {
                wins: 0,
                losses: 0,
                ties: 0
            };
        }
        
        function pickComputerMove() {
            const randomNunber = Math.random();
            let computerMove = '';
            if (randomNunber < 1/3) {
                computerMove = 'Rock';
            } else if (randomNunber >= 1/3 && randomNunber < 2/3){
                computerMove = 'Paper';
            } else if (randomNunber >= 2/3 && randomNunber < 1) {
                computerMove = 'Scissors';
            }

            return computerMove;
        }

        function playGame(yourMove) {
            const computerMove = pickComputerMove();

            let result = '';
            if (yourMove === 'Scissors') {
                if (computerMove === yourMove) {
                    result = 'Tie!';
                } else if (computerMove === 'Rock') {
                    result = 'You Lose!';
                } else if (computerMove === 'Paper') {
                    result = 'You Win!';
                }
            } else if (yourMove === 'Rock'){
                if (computerMove === yourMove){
                    result = 'Tie!';
                } else if (computerMove === 'Scissors'){
                    result = 'You Win!';
                } else if (computerMove === 'Paper'){
                    result = 'You Lose!';
                }
            } else if (yourMove === 'Paper'){
                if (computerMove === yourMove){
                    result = 'Tie!';
                } else if (computerMove === 'Scissors'){
                    result = 'You Lose!';
                } else if (computerMove === 'Rock'){
                    result = 'You Win!';
                }
            }

            if (result === 'You Win!'){
                score.wins += 1;
            } else if (result === 'You Lose!'){
                score.losses += 1;
            } else if (result === 'Tie!'){
                score.ties += 1;
            }

            localStorage.setItem('score', JSON.stringify(score));

            return {
                yourMove,
                computerMove,
                result
            };
        }

        function toast(yourMove, computerMove, result) {
            if (!yourMove || !computerMove || !result) {
                alert(`Score: Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`);
                return;
            }
            alert(`You picked ${yourMove}. Computer picked ${computerMove}. ${result}
            Score: Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`);
        }
    </script>
</body>
</html>
